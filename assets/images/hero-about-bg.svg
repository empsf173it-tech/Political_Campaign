<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aboutBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Center Halo Glow -->
    <radialGradient id="centerHalo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Ribbon Blue Gradient -->
    <linearGradient id="ribbonBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Ribbon Gold Gradient -->
    <linearGradient id="ribbonGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="1080" fill="url(#aboutBgGrad)"/>

  <!-- Center Candidate Halo -->
  <circle cx="960" cy="420" r="600" fill="url(#centerHalo)"/>

  <!-- Curved Laurel Waves & Ribbon Arcs -->
  <path d="M-100,500 C400,200 1500,800 2020,400 L2020,1080 L-100,1080 Z" fill="url(#ribbonBlueGrad)"/>
  <path d="M-100,600 C500,300 1400,900 2020,500 L2020,1080 L-100,1080 Z" fill="url(#ribbonGoldGrad)"/>

  <!-- Vector Profile Emblem / Leadership Shield Silhouette in Background -->
  <g opacity="0.07" transform="translate(960, 420) scale(1.4)" stroke="#FFFFFF" stroke-width="2" fill="none">
    <!-- Outer Crest Shield -->
    <path d="M-120,-160 L120,-160 C120,-40 180,120 0,220 C-180,120 -120,-40 -120,-160 Z"/>
    <!-- Inner Star -->
    <polygon points="0,-100 25,-40 90,-40 38,5 60,65 0,25 -60,65 -38,5 -90,-40 -25,-40" fill="#F59E0B" opacity="0.3"/>
  </g>

  <!-- Top Star Line Motif -->
  <g transform="translate(960, 150)">
    <polygon points="0,-15 5,-3 18,-3 8,4 12,16 0,8 -12,16 -8,4 -18,-3 -5,-3" fill="#F59E0B" opacity="0.85"/>
    <polygon points="-70,-15 -66,-5 -54,-5 -63,1 -60,11 -70,5 -80,11 -77,1 -86,-5 -74,-5" fill="#2563EB" opacity="0.75"/>
    <polygon points="70,-15 74,-5 86,-5 77,1 80,11 70,5 60,11 63,1 54,-5 66,-5" fill="#2563EB" opacity="0.75"/>
    <line x1="-250" y1="-3" x2="-110" y2="-3" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="110" y1="-3" x2="250" y2="-3" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <!-- Subtle Horizontal Grid Lines -->
  <line x1="0" y1="260" x2="1920" y2="260" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="580" x2="1920" y2="580" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
</svg>
