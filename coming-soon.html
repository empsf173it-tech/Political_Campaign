<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debate Stream Launching Soon - CivicPulse 2026</title>
  <meta name="description" content="Get ready for the live political debate broadcast. Launching soon on CivicPulse Campaign portal.">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-dark text-white">

  <!-- FIXED STICKY HEADER -->
  <header class="navbar-sticky" style="background-color: rgba(15, 23, 42, 0.95);">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="navbar-brand m-0">
        <img src="assets/images/logo-dark.svg" alt="CivicPulse Logo" class="header-logo">
      </a>

      <div class="d-flex align-items-center gap-2">
        <a href="login.html" class="btn btn-primary-custom">Login</a>
      </div>
    </div>
  </header>

  <main class="d-flex align-items-center justify-content-center min-vh-100 py-5 text-center position-relative" style="background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);">
    <div class="container">
      <div class="max-w-700 mx-auto">
        <span class="subheading text-warning">State Debate Broadcast</span>
        <h1 class="text-white display-3 mb-3">Live Townhall Launching Soon</h1>
        <p class="lead-text text-light mb-5">
          We are preparing our live video streaming portal for the upcoming Statewide Senate Debate. Subscribe below for instant broadcast alerts.
        </p>

        <!-- Countdown Display Box -->
        <div class="row g-3 justify-content-center mb-5">
          <div class="col-3 col-sm-2">
            <div class="p-3 rounded bg-secondary text-white">
              <h2 class="h1 text-white mb-0">12</h2>
              <small class="text-uppercase" style="font-size: 0.7rem;">Days</small>
            </div>
          </div>
          <div class="col-3 col-sm-2">
            <div class="p-3 rounded bg-secondary text-white">
              <h2 class="h1 text-white mb-0">18</h2>
              <small class="text-uppercase" style="font-size: 0.7rem;">Hours</small>
            </div>
          </div>
          <div class="col-3 col-sm-2">
            <div class="p-3 rounded bg-secondary text-white">
              <h2 class="h1 text-white mb-0">45</h2>
              <small class="text-uppercase" style="font-size: 0.7rem;">Mins</small>
            </div>
          </div>
          <div class="col-3 col-sm-2">
            <div class="p-3 rounded bg-secondary text-white">
              <h2 class="h1 text-white mb-0">30</h2>
              <small class="text-uppercase" style="font-size: 0.7rem;">Secs</small>
            </div>
          </div>
        </div>

        <!-- Notify Subscription Form -->
        <form class="row g-2 justify-content-center max-w-500 mx-auto">
          <div class="col-8">
            <input type="email" class="form-control form-control-lg" placeholder="Enter your email" required>
          </div>
          <div class="col-4">
            <button type="submit" class="btn btn-tertiary-custom btn-lg w-100">Notify Me</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer-main">
    <div class="container text-center">
      <p class="mb-0 small text-light">&copy; 2026 CivicPulse Campaign. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
